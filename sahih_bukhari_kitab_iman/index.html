        function displaySessions(sessionsToShow) {
            const grid = document.getElementById('session-grid');
            grid.innerHTML = '';

            if (sessionsToShow.length === 0) {
                grid.innerHTML = '<div class="no-results"><i class="material-icons">search_off</i><p>No sessions found</p></div>';
                return;
            }

            sessionsToShow.forEach(session => {
                const card = document.createElement('div');
                card.className = 'session-card';
                card.innerHTML = `
                    <div class="session-number">Sesi ${session.number}</div>
                    <div class="session-title">${session.title}</div>
                    <div class="session-description">${session.description}</div>
                    <a href="session${session.number}.html" class="watch-btn">Tonton Video</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterSessions(searchTerm) {
            if (!searchTerm) return sessions;
            
            return sessions.filter(session => 
                session.number.toString().includes(searchTerm) ||
                session.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                session.description.toLowerCase().includes(searchTerm.toLowerCase())
            );
        }

        // Search functionality
        document.getElementById('session-search').addEventListener('input', function(e) {
            const searchTerm = e.target.value;
            const clearButton = document.getElementById('clear-search');
            
            if (searchTerm) {
                clearButton.classList.add('visible');
            } else {
                clearButton.classList.remove('visible');
            }
            
            const filteredSessions = filterSessions(searchTerm);
            displaySessions(filteredSessions);
        });

        // Clear search
        document.getElementById('clear-search').addEventListener('click', function() {
            document.getElementById('session-search').value = '';
            this.classList.remove('visible');
            displaySessions(sessions);
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            displaySessions(sessions);
        });

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.className;
            if (currentTheme === 'light-theme') {
                html.className = 'dark-theme';
            } else if (currentTheme === 'dark-theme') {
                html.className = 'sepia-theme';
            } else {
                html.className = 'light-theme';
            }
        }
