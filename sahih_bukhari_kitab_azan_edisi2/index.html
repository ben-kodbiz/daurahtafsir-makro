<!DOCTYPE html>
<html lang="ms" class="light-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahih Bukhari-Kitab Azan(edisi2) - Maulana Asri</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .session-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .session-number {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .session-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .session-description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .watch-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            text-align: center;
        }

        .watch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-top: 50px;
        }

        /* Search Styles */
        .search-container {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            padding: 0 20px;
        }

        .search-box {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 16px;
            z-index: 1;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 45px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background-color: white;
        }

        .search-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .clear-search {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            color: #999;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clear-search.visible {
            opacity: 1;
            visibility: visible;
        }

        .clear-search:hover {
            color: #666;
        }

        /* Dark theme search styles */
        body.dark-theme .search-input {
            background-color: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }

        body.dark-theme .search-input:focus {
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.1);
        }

        body.dark-theme .search-icon {
            color: #a0aec0;
        }

        body.dark-theme .clear-search {
            color: #a0aec0;
        }

        body.dark-theme .clear-search:hover {
            color: #e2e8f0;
        }

        /* Sepia theme search styles */
        body.sepia-theme .search-input {
            background-color: #f7f3e9;
            border-color: #d4c5a0;
            color: #5d4e37;
        }

        body.sepia-theme .search-input:focus {
            border-color: #8b7355;
            box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
        }

        body.sepia-theme .search-icon {
            color: #8b7355;
        }

        body.sepia-theme .clear-search {
            color: #8b7355;
        }

        body.sepia-theme .clear-search:hover {
            color: #5d4e37;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .sessions-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .session-card {
                padding: 15px;
            }

            .search-container {
                padding: 0 15px;
                margin-bottom: 20px;
            }

            .search-input {
                font-size: 16px;
                padding: 10px 40px 10px 40px;
            }
        }

        /* Dark Theme Styles */
        html.dark-theme body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        html.dark-theme .header {
            color: #e0e0e0;
        }

        html.dark-theme .back-link {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        html.dark-theme .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        html.dark-theme .search-input {
            background-color: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }

        html.dark-theme .search-input:focus {
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.1);
        }

        html.dark-theme .search-icon {
            color: #a0aec0;
        }

        html.dark-theme .clear-search {
            color: #a0aec0;
        }

        html.dark-theme .clear-search:hover {
            color: #e2e8f0;
        }

        html.dark-theme .session-card {
            background: rgba(40, 40, 40, 0.9);
            color: #e0e0e0;
        }

        html.dark-theme .session-card:hover {
            background: rgba(50, 50, 50, 0.9);
        }

        html.dark-theme .session-title {
            color: #e0e0e0;
        }

        html.dark-theme .session-description {
            color: #a0aec0;
        }

        /* Sepia Theme Styles */
        html.sepia-theme body {
            background: linear-gradient(135deg, #f4f1e8 0%, #e8dcc0 100%);
        }

        html.sepia-theme .header {
            color: #5d4e37;
        }

        html.sepia-theme .back-link {
            background: rgba(139, 115, 85, 0.3);
            color: #5d4e37;
        }

        html.sepia-theme .back-link:hover {
            background: rgba(139, 115, 85, 0.5);
        }

        html.sepia-theme .search-input {
            background-color: #f7f3e9;
            border-color: #d4c5a0;
            color: #5d4e37;
        }

        html.sepia-theme .search-input:focus {
            border-color: #8b7355;
            box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
        }

        html.sepia-theme .search-icon {
            color: #8b7355;
        }

        html.sepia-theme .clear-search {
            color: #8b7355;
        }

        html.sepia-theme .clear-search:hover {
            color: #5d4e37;
        }

        html.sepia-theme .session-card {
            background: rgba(245, 240, 225, 0.9);
            color: #5d4e37;
        }

        html.sepia-theme .session-card:hover {
            background: rgba(240, 235, 220, 0.9);
        }

        html.sepia-theme .session-title {
            color: #5d4e37;
        }

        html.sepia-theme .session-description {
            color: #8b7355;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Kembali ke Halaman Utama</a>
        
        <div class="header">
            <button class="theme-toggle" onclick="toggleTheme()">
                <i class="material-icons theme-icon">brightness_4</i>
            </button>
            <h1>Sahih Bukhari-Kitab Azan(edisi2)</h1>
            <p>Syarahan Kitab Hadith Sahih al-Bukhari - Kitab Azan (Edisi 2) oleh Maulana Muhd Asri Yusoff</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="Cari sesi berdasarkan judul atau nomor..." id="searchInput">
                <button class="clear-search" id="clearSearch">✕</button>
            </div>
        </div>

        <div id="loading" class="loading">
            Memuat sesi-sesi...
        </div>

        <div id="sessions-container" class="sessions-grid" style="display: none;">
            <!-- Sessions will be loaded here -->
        </div>
    </div>

    <script>
        let allSessions = [];

        async function loadSessions() {
            try {
                const response = await fetch('sahih_bukhari_kitab_azan_edisi2.json');
                const data = await response.json();
                
                allSessions = data.sessions;
                displaySessions(allSessions);
                setupSearchFunctionality();
                
            } catch (error) {
                console.error('Error loading sessions:', error);
                document.getElementById('loading').innerHTML = 'Ralat memuat data. Sila cuba lagi.';
            }
        }

        function displaySessions(sessions) {
            const container = document.getElementById('sessions-container');
            const loading = document.getElementById('loading');
            
            container.innerHTML = '';
            
            sessions.forEach(session => {
                const sessionCard = document.createElement('div');
                sessionCard.className = 'session-card';
                
                sessionCard.innerHTML = `
                    <div class="session-number">Sesi ${session.id}</div>
                    <div class="session-title">${session.title}</div>
                    <div class="session-description">${session.description}</div>
                    <a href="session${session.id}.html" class="watch-btn">Tonton Video</a>
                `;
                
                container.appendChild(sessionCard);
            });
            
            loading.style.display = 'none';
            container.style.display = 'grid';
        }

        function setupSearchFunctionality() {
            const searchInput = document.getElementById('searchInput');
            const clearButton = document.getElementById('clearSearch');

            searchInput.addEventListener('input', function() {
                const query = this.value.trim();
                if (query) {
                    clearButton.classList.add('visible');
                    const filteredSessions = filterSessions(query);
                    displaySessions(filteredSessions);
                } else {
                    clearButton.classList.remove('visible');
                    displaySessions(allSessions);
                }
            });

            clearButton.addEventListener('click', function() {
                searchInput.value = '';
                this.classList.remove('visible');
                displaySessions(allSessions);
                searchInput.focus();
            });
        }

        function filterSessions(query) {
            const searchTerm = query.toLowerCase();
            return allSessions.filter(session => {
                const titleMatch = session.title.toLowerCase().includes(searchTerm);
                const descriptionMatch = session.description.toLowerCase().includes(searchTerm);
                const idMatch = session.id.toString().includes(searchTerm);
                return titleMatch || descriptionMatch || idMatch;
            });
        }

        // Load sessions when page loads
        document.addEventListener('DOMContentLoaded', loadSessions);

        // Theme toggle functionality
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.className;
            if (currentTheme === 'light-theme') {
                html.className = 'dark-theme';
            } else if (currentTheme === 'dark-theme') {
                html.className = 'sepia-theme';
            } else {
                html.className = 'light-theme';
            }
        }
    </script>
</body>
</html>
