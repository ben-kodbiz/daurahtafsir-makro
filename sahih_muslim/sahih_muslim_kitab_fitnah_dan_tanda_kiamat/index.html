        /* Material Design Video Grid */
        .md-video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin: 32px 0;
            padding: 0 16px;
        }
        
        /* Grid Item */
        .md-grid-item {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .md-grid-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }
        
        /* Thumbnail */
        .md-thumbnail-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            background: #f5f5f5;
        }
        
        .md-thumbnail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .md-grid-item:hover .md-thumbnail {
            transform: scale(1.03);
        }
        
        .md-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .md-grid-item:hover .md-play-overlay {
            opacity: 1;
        }
        
        .md-play-icon {
            color: white;
            font-size: 3.5rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        /* Session Info */
        .md-session-info {
            padding: 20px;
        }
        
        /* Chip */
        .md-session-chip {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 16px;
        }
        
        .md-chip-icon {
            font-size: 1rem;
            margin-right: 6px;
        }
        
        .md-chip-text {

        }

            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(63, 81, 181, 0.3);
        }
        
        .md-watch-button:hover {
            background: linear-gradient(135deg, #607d8b, #3f51b5);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(63, 81, 181, 0.4);
        }
        
        .md-button-icon {
            font-size: 1.2rem;
            margin-right: 8px;
        }
        
        /* No Results */
        .md-no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #757575;
        }
        
        .md-no-results i {
            font-size: 3rem;
            margin-bottom: 16px;
            color: #bdbdbd;
        }
        
        /* Search Container */
        .search-container {
            max-width: 700px;
            margin: 25px auto;
            position: relative;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 35px;

        function displaySessions(sessionsToShow) {
            const grid = document.getElementById('md-video-grid');
            grid.innerHTML = '';

            if (sessionsToShow.length === 0) {
                grid.innerHTML = '<div class="md-no-results"><i class="material-icons">search_off</i><p>No sessions found</p></div>';
                return;
            }

            let gridHTML = '';
            sessionsToShow.forEach(session => {
                gridHTML += `
                <div class="md-grid-item" data-session="${session.number}">
                    <div class="md-thumbnail-container elevation-2">
                        <img src="https://img.youtube.com/vi/${session.videoId}/mqdefault.jpg" 
                             alt="${session.title}" 
                             class="md-thumbnail" 
                             onerror="this.src='https://placehold.co/320x180?text=No+Thumbnail'">
                        <div class="md-play-overlay">
                            <i class="material-icons md-play-icon">play_arrow</i>
                        </div>
                    </div>
                    <div class="md-session-info">
                        <div class="md-session-chip">
                            <i class="material-icons md-chip-icon">confirmation_number</i>
                            <span class="md-chip-text">Sesi ${session.number}</span>
                        </div>
                        <h3 class="md-session-title">${session.title}</h3>
                        <a href="session${session.number}.html" class="md-watch-button">
                            <i class="material-icons md-button-icon">play_circle_outline</i>
                            <span>Tonton Video</span>
                        </a>
                    </div>
                </div>`;
            });
            grid.innerHTML = gridHTML;
        }

        function filterSessions(searchTerm) {
            if (!searchTerm) return sessions;
            
            return sessions.filter(session => 
                session.number.toString().includes(searchTerm) ||
                session.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                session.description.toLowerCase().includes(searchTerm.toLowerCase())
            );
        }

        // Search functionality
        document.getElementById('session-search').addEventListener('input', function(e) {
            const searchTerm = e.target.value.trim();
            const clearButton = document.getElementById('clear-search');
            
            if (searchTerm) {
                clearButton.classList.remove('hidden');
            } else {
                clearButton.classList.add('hidden');
            }
            
            const filteredSessions = filterSessions(searchTerm);
            displaySessions(filteredSessions);
        });

        // Clear search
        document.getElementById('clear-search').addEventListener('click', function() {
            document.getElementById('session-search').value = '';
            this.classList.add('hidden');
            displaySessions(sessions);
        });

        // Initialize the grid
        document.addEventListener('DOMContentLoaded', function() {
            displaySessions(sessions);
        });

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.className;
            if (currentTheme === 'light-theme') {
                html.className = 'dark-theme';
            } else if (currentTheme === 'dark-theme') {
                html.className = 'sepia-theme';
            } else {
                html.className = 'light-theme';
