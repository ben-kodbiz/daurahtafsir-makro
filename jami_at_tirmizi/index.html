<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jami at-Tirmizi - Kitab Thaharah</title>
    <link rel="stylesheet" href="../unified-sahih-bukhari-theme.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <div class="tutorial-container">
        <a href="../index.html" class="back-link">
            <i class="material-icons">arrow_back</i>
            Back to Main App
        </a>
        <div class="header">
            <h1>Jami at-Tirmizi - Kitab Thaharah</h1>
        </div>
        <div class="search-container">
            <div class="search-box">
                <i class="material-icons search-icon">search</i>
                <input type="text" id="session-search" class="search-input" placeholder="Search sessions by title or number..." />
                <button id="clear-search" class="clear-search">
                    <i class="material-icons">close</i>
                </button>
            </div>
        </div>
        <div class="session-grid" id="session-grid">
        </div>
    </div>
    <script src="script.js?v=1"></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.className;
            if (currentTheme === 'light-theme') {
                html.className = 'dark-theme';
            } else if (currentTheme === 'dark-theme') {
                html.className = 'sepia-theme';
            } else {
                html.className = 'light-theme';
            }
        }
    </script>
</body>
</html>
