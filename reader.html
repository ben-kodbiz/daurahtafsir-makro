<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafsir Reader – Daurah Tafsir Makro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="reader-bar">
        <a href="index.html" class="back-button" id="reader-back">
            <i class="material-icons" aria-hidden="true">arrow_back</i>
            Back
        </a>
        <h1 class="surah-title" id="reader-title">Tafsir</h1>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
            <i class="material-icons theme-icon" aria-hidden="true">brightness_4</i>
        </button>
    </div>

    <div class="reader-container" id="pdf-container">
        <div id="pdf-message" class="pdf-message" hidden>
            <p id="pdf-message-text">Unable to load this tafsir PDF.</p>
            <div class="action-buttons pdf-message-actions">
                <button class="read-button" id="retry-button">Try Again</button>
                <a class="download-button" id="error-download-link" download>Download PDF</a>
            </div>
        </div>

        <div id="pdf-loading" class="pdf-loading">Loading…</div>

        <div id="pdf-view"></div>
    </div>

    <nav class="reader-toolbar" aria-label="PDF controls">
        <button id="prev-page" aria-label="Previous page">&#10094;</button>
        <form id="goto-form" aria-label="Go to page">
            Page
            <input type="number" id="page-input" min="1" value="1" inputmode="numeric" aria-label="Page number">
            <span id="page-count">/ –</span>
            <button type="submit" class="goto-go">Go</button>
        </form>
        <button id="next-page" aria-label="Next page">&#10095;</button>
        <span class="toolbar-spacer"></span>
        <button id="zoom-out" aria-label="Zoom out">&#8722;</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <a id="download-pdf" class="download-button toolbar-download" download aria-label="Download PDF">Download</a>
    </nav>

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="theme.js"></script>
    <script src="js/reader.js?v=1"></script>
</body>
</html>
