<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jami at-Tirmizi - Kitab Thaharah</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <div class="tutorial-container">
        <div class="app-bar">
            <a href="../index.html" class="back-button">
               <i class="material-icons">arrow_back</i>
                Back to Main App
            </a>
            <h1 class="tutorial-title">Jami at-Tirmizi - Kitab Thaharah</h1>
            <button class="theme-toggle" onclick="toggleTheme()">
                <i class="material-icons theme-icon">brightness_4</i>
            </button>
        </div>
        <div class="session-grid" id="session-grid">
        </div>
    </div>
    <script src="script.js?v=1"></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.className;
            if (currentTheme === 'light-theme') {
                html.className = 'dark-theme';
            } else if (currentTheme === 'dark-theme') {
                html.className = 'sepia-theme';
            } else {
                html.className = 'light-theme';
            }
        }
    </script>
</body>
</html>
