<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilal at-Tirmizi - Kecacatan Dalam Hadith</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .session-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .session-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .session-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            position: relative;
        }
        
        .session-thumbnail::after {
            content: '▶';
            position: absolute;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        
        .session-card:hover .session-thumbnail::after {
            transform: scale(1.1);
        }
        
        .session-info {
            padding: 20px;
        }
        
        .session-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .session-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        
        .page-header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 30px;
        }
        
        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .page-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .session-grid {
                grid-template-columns: 1fr;
                padding: 15px;
            }
            
            .page-title {
                font-size: 2rem;
            }
            
            .page-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="../index.html">📚 Daurah Tafsir Makro</a>
            </div>
            <div class="nav-menu">
                <a href="../index.html" class="nav-link">Tafsir Mikro</a>
                <a href="../jami_at_tirmizi/index.html" class="nav-link">Jami at-Tirmizi</a>
                <a href="index.html" class="nav-link active">Ilal at-Tirmizi</a>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <h1 class="page-title">Ilal at-Tirmizi</h1>
        <p class="page-subtitle">Kecacatan Dalam Hadith (at-Tirmizi)</p>
    </div>

    <div class="container">
        <div id="session-grid" class="session-grid">
            <!-- Sessions will be loaded here -->
        </div>
    </div>

    <script>
        async function loadSessions() {
            try {
                const response = await fetch('ilal_at_tirmizi.json');
                const data = await response.json();
                
                const sessionGrid = document.getElementById('session-grid');
                
                data.sessions.forEach(session => {
                    const sessionCard = document.createElement('div');
                    sessionCard.className = 'session-card';
                    sessionCard.onclick = () => {
                        window.location.href = `session${session.id}.html`;
                    };
                    
                    sessionCard.innerHTML = `
                        <div class="session-thumbnail">
                            ${session.id}
                        </div>
                        <div class="session-info">
                            <h3 class="session-title">${session.title}</h3>
                            <p class="session-description">${session.description}</p>
                        </div>
                    `;
                    
                    sessionGrid.appendChild(sessionCard);
                });
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }
        
        // Load sessions when page loads
        document.addEventListener('DOMContentLoaded', loadSessions);
    </script>
</body>
</html>
