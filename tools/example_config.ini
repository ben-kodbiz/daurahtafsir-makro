# Example Configuration for Islamic Lecture Channels

# This is an example configuration file showing how to customize
# the channel processor for different types of Islamic lecture channels

[DEFAULT]
output_dir = ./output
session_template = session_template.html
index_template = index_template.html
video_data_file = video_data.txt
ytid_file = ytid.txt
json_file = channel_data.json

[YOUTUBE]
yt_dlp_path = yt-dlp
max_videos = 150
request_delay = 4.0

[TEMPLATES]
session_title_prefix = Sesi
session_title_separator = " - "
session_description_template = Kandungan untuk {session_title} dalam modul {module_name}.

[OUTPUT]
# Patterns to remove from titles for cleaner display
title_clean_patterns = [
    "\\[.*?\\]",           # Remove anything in brackets
    "Sesi \\d+ - ",        # Remove session number prefixes
    "sesi \\d+ - ",        # Remove lowercase session number prefixes
    "PART \\d+ - ",        # Remove PART prefixes
    "Part \\d+ - "         # Remove Part prefixes
]
title_clean_replacements = ["", "", "", "", ""]
max_title_length = 80

[NAMING]
session_file_pattern = session{number}.html
index_file = index.html

# Custom settings for different channel types

[TAFSIR_CHANNELS]
max_videos = 120
session_title_prefix = Tafsir
session_description_template = Tafsir Surah {session_title} dalam kajian terperinci.

[HADIS_CHANNELS]
max_videos = 100
session_title_prefix = Hadis
session_description_template = Kajian hadis {session_title} dari kitab sahih.

[FIQH_CHANNELS]
max_videos = 80
session_title_prefix = Fiqh
session_description_template = Hukum fiqh mengenai {session_title} berdasarkan al-Quran dan al-Hadis.

[AQIDAH_CHANNELS]
max_videos = 60
session_title_prefix = Aqidah
session_description_template = Prinsip aqidah {session_title} dalam perspektif Ahlus Sunnah.